<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset ="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contacto- La Parada Del Sabor</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body class="contact-view">
        


         <!-- Hero Section -->
          <header id="hero">
            
            <div id="logo">
  <a href="index.html" class="logo-clickable">
    <span class="logo-line">La Parada</span>
    <span class="logo-small">del</span>
  </a>

  <svg viewBox="0 0 350 150" width="350" height="160" class="logo-curve">
  <defs>
    <path id="curvePath" d="M -8.5 31.5 Q 195 95 347 35" fill="transparent" />
  </defs>
  
  <text  class="logo-big-svg" text-anchor="middle">
    <textPath xlink:href="#curvePath" startOffset="21.2%">S</textPath>
    <textPath xlink:href="#curvePath" startOffset="35.8%">A</textPath>
    <textPath xlink:href="#curvePath" startOffset="52%">B</textPath>
    <textPath xlink:href="#curvePath" startOffset="68%">O</textPath>
    <textPath xlink:href="#curvePath" startOffset="84.2%">R</textPath>
  </text>
</svg>
</div>
            <p class="location-text">102 W Susquehanna St, Allentown, PA</p>
<div class="location-underline"></div>
          </header>

          <!-- Main Navigation -->

             


              <!-- Contact Section-->
               <section id="contact">
                <a id="home-btn" href="index.html" aria-label="Home"></a>
                <h2 class="contact-heading">Contacto</h2>
                <div class="contact-content">
                <p>Telefono: (610) 797-2112</p>
                <p>Direccion: 102 W Susquehanna St, Allentown, PA</p>
                <p>Horario: 9AM - 9PM</p>
                <p>Lunes a Sabado</p>
                <p>Cerrado los Domingos</p>
                </div>
               </section>

                <script src="script.js"></script>

    </body>
</html>
